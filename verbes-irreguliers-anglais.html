<title>Verbes irréguliers · Anglais</title>
<style>
:root{
  --u: 32px;                     /* un carreau Seyès (8 mm) */
  --papier:#fbfcff;
  --carreau-fin:#e8ecf9;
  --carreau-fort:#c9d1f0;
  --encre:#1c2a72;
  --encre-douce:#4a5590;
  --marge:#e0525e;
  --stylo:#d13540;               /* stylo rouge du prof */
  --faux:#c0283a;
  --juste:#1d7548;
  --focus:#6474d8;
  --sa-g:env(safe-area-inset-left,0px);
  --sa-d:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --voile:rgba(255,255,255,.88);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;-webkit-tap-highlight-color:rgba(28,42,114,.12)}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  touch-action:manipulation;
  font:400 1rem/1.55 var(--sans);
  color:var(--encre);
  background-color:var(--papier);
  background-image:
    linear-gradient(to right,var(--carreau-fort) 1px,transparent 1px),
    linear-gradient(to bottom,var(--carreau-fort) 1px,transparent 1px),
    linear-gradient(to bottom,var(--carreau-fin) 1px,transparent 1px);
  background-size:var(--u) var(--u),var(--u) var(--u),var(--u) calc(var(--u)/4);
}

/* La feuille : marge rouge à gauche, contenu posé sur les carreaux */
.feuille{
  position:relative;
  max-width:44rem;
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  padding:calc(var(--u)*1.5) calc(1rem + var(--sa-d)) calc(var(--u)*1.5 + var(--sa-b)) calc(2.4rem + var(--sa-g));
}
.feuille::before{
  content:"";
  position:absolute;
  top:0;bottom:0;left:calc(1.3rem + var(--sa-g));
  border-left:2px solid var(--marge);
  opacity:.7;
}

h1{
  display:inline-block;
  margin:0;
  padding-bottom:.12em;
  font:italic 700 clamp(1.8rem,6vw,2.5rem)/1.15 var(--serif);
  color:var(--encre);
  border-bottom:3px solid var(--marge);   /* titre souligné à la règle */
}
h2{
  margin:calc(var(--u)*1.5) 0 .5rem;
  font:italic 700 1.4rem/1.25 var(--serif);
  color:var(--encre);
}
p{margin:.5rem 0}
.intro{max-width:36rem;margin-top:calc(var(--u)*.75)}
.discret{color:var(--encre-douce);font-size:.9rem}

/* Choix (boutons radio en pastilles) */
fieldset{border:0;margin:0 0 1rem;padding:0;min-width:0}
legend{padding:0;margin-bottom:.4rem;font-weight:600}
.pastilles{display:flex;flex-wrap:wrap;gap:.5rem}
.choix{position:relative;display:inline-block}
.choix input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.choix span{
  display:inline-flex;align-items:center;gap:.45rem;
  min-height:44px;padding:0 1rem;
  border:2px solid var(--encre);border-radius:999px;
  background:var(--voile);color:var(--encre);
  font-weight:600;font-size:.95rem;cursor:pointer;
}
.choix .nb{font-weight:400;color:var(--encre-douce);font-size:.85rem}
.choix input:checked + span{background:var(--encre);color:#fff}
.choix input:checked + span .nb{color:#c9d1f0}
.choix input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.choix input:disabled + span{opacity:.55;border-style:dashed;cursor:not-allowed}

/* Boutons */
.btn{
  font:600 1rem var(--sans);
  min-height:48px;padding:.6rem 1.3rem;
  color:var(--encre);background:var(--voile);
  border:2px solid var(--encre);border-radius:6px;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
.btn.principal{background:var(--encre);color:#fff}
@media (hover:hover){
  .btn:hover{background:#eef1fc}
  .btn.principal:hover{background:#142059}
}
.btn:focus-visible,.lien:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:calc(var(--u)*.75)}
.lien{
  font:inherit;color:var(--encre-douce);background:none;border:0;
  text-decoration:underline;cursor:pointer;min-height:44px;padding:0 .25rem;
  -webkit-appearance:none;appearance:none;
}

/* Relevés à points de suite */
ul.points{list-style:none;margin:0;padding:0}
ul.points li{
  display:flex;align-items:flex-end;gap:.5rem;
  min-height:var(--u);padding:.15rem 0;
  background:var(--voile);
}
.lead{flex:1 1 1rem;min-width:.75rem;align-self:flex-end;height:1.05em;border-bottom:2px dotted #8d97cf}
.serif{font-family:var(--serif)}

}

<script>
(function(){
'use strict';

/* ---------- Données et constantes ---------- */
const VERBES = JSON.parse(document.getElementById('donnees-verbes').textContent);
const NB = 10;                                   // questions par série
const CLE = 'verbes-irreguliers:v1';
const ANCIENNE_CLE = 'verbes-irreguliers-seconde:v1';   // reprise des scores d'une version précédente
const FORMES = [
  {k:'b',  nom:'Base verbale',    court:'la base verbale'},
  {k:'p',  nom:'Prétérit',        court:'le prétérit'},
  {k:'pp', nom:'Participe passé', court:'le participe passé'}
];
const NOMS_NIVEAU = {'1':'Indispensables','2':'Courants','tous':'Tous','faibles':'Points faibles'};

/* ---------- Mémoire des scores (localStorage) ---------- */
let stockageOk = true;
const vierge = () => ({sessions:[], verbes:{}, prefs:{niveau:'1', mode:'deux'}});

function charger(){
  try{
    localStorage.setItem(CLE+':test','1');
    localStorage.removeItem(CLE+':test');
    const brut = localStorage.getItem(CLE) || localStorage.getItem(ANCIENNE_CLE);
    if(brut){
      const d = JSON.parse(brut);
      if(d && typeof d === 'object'){
        return {
          sessions: Array.isArray(d.sessions) ? d.sessions : [],
          verbes: (d.verbes && typeof d.verbes === 'object') ? d.verbes : {},
          prefs: Object.assign({niveau:'1', mode:'deux'}, d.prefs || {})
        };
      }
    }
  }catch(e){ stockageOk = false; }
  return vierge();
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(stock)); }
  catch(e){ stockageOk = false; }
}
let stock = charger();

/* ---------- Petits outils ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aff = s => esc(s).split('/').join(' / ');
const nombreFr = n => String(Math.round(n*10)/10).replace('.', ',');
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');

function estJuste(saisie, attendu){
  const admis = new Set(attendu.split('/').map(norm));
  const parts = norm(saisie).split(/\s*(?:\/|,|;|\bor\b|\bou\b)\s*/).filter(Boolean);
  return parts.length > 0 && parts.every(p => admis.has(p));
}
function melanger(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Choix des verbes (les verbes ratés reviennent plus souvent) ---------- */
function poids(v){
  const e = stock.verbes[v.b];
  if(!e || !e.a) return 2;                       // jamais vu : légèrement prioritaire
  let w = 1 + 4 * (1 - e.c / e.a);
  if(e.d === false) w += 2;                      // raté la dernière fois
  return w;
}
function tirage(pool, n){
  const restants = pool.slice();
  const out = [];
  while(out.length < n && restants.length){
    const total = restants.reduce((t, v) => t + poids(v), 0);
    let r = Math.random() * total, i = 0;
    for(; i < restants.length; i++){ r -= poids(restants[i]); if(r <= 0) break; }
    if(i >= restants.length) i = restants.length - 1;
    out.push(restants.splice(i, 1)[0]);
  }
  return out;
}
function faibles(){
  return VERBES.filter(v => {
    const e = stock.verbes[v.b];
    return e && e.a > 0 && (e.d === false || e.c / e.a < 0.7);
  });
}
function stats(){
  const reelles = stock.sessions.filter(x => !x.r);
  let meilleur = null;
  reelles.forEach(x => { if(!meilleur || x.s / x.t > meilleur.s / meilleur.t) meilleur = x; });
  const der = reelles.slice(-5);
  const moy = der.length ? der.reduce((t, x) => t + x.s / x.t, 0) / der.length * 10 : null;
  let maitrises = 0;
  VERBES.forEach(v => {
    const e = stock.verbes[v.b];
    if(e && e.a >= 2 && e.c / e.a >= 0.8 && e.d) maitrises++;
  });
  return {jouees: reelles.length, meilleur, moy, maitrises};
}

/* ---------- État de l'application ---------- */
const app = document.getElementById('app');
let etat = {ecran:'accueil', session:null, confirmer:false};
let verrou = 0;

const courante = () => etat.session.questions[etat.session.i];
const aTrouver = q => FORMES.map(f => f.k).filter(k => k !== q.donne);

function lancer(verbes, meta){
  etat.session = {
    questions: verbes.map(v => ({
      v,
      donne: meta.mode === 'deux' ? ['b','p','pp'][Math.floor(Math.random()*3)] : null,
      saisies: {b:'', p:'', pp:''},
      res: null
    })),
    i: 0, score: 0, meta, record: false
  };
  etat.ecran = 'quiz';
  render(true);
}
function lancerSerie(niveau, mode){
  let choix;
  if(niveau === 'faibles'){
    const f = faibles();
    choix = tirage(f, NB);
    if(choix.length < NB){
      const reste = VERBES.filter(v => f.indexOf(v) === -1);
      choix = choix.concat(tirage(reste, NB - choix.length));
    }
  }else{
    const pool = niveau === 'tous' ? VERBES : VERBES.filter(v => String(v.n) === niveau);
    choix = tirage(pool, NB);
  }
  lancer(melanger(choix), {niveau, mode, revision:false});
}

/* ---------- Actions ---------- */
const actions = {
  commencer(){
    const n = app.querySelector('input[name=niveau]:checked');
    const m = app.querySelector('input[name=mode]:checked');
    const niveau = n ? n.value : '1';
    const mode = m ? m.value : 'deux';
    stock.prefs = {niveau, mode};
    sauver();
    lancerSerie(niveau, mode);
  },
  valider(){
    const q = courante();
    if(q.res) return;
    const trouver = aTrouver(q);
    trouver.forEach(k => {
      const inp = document.getElementById('champ-' + k);
      q.saisies[k] = inp ? inp.value : '';
    });
    const champs = {};
    let tout = true;
    trouver.forEach(k => {
      const ok = estJuste(q.saisies[k], q.v[k]);
      champs[k] = ok;
      if(!ok) tout = false;
    });
    q.res = {champs, ok: tout};
    if(tout) etat.session.score++;

    const e = stock.verbes[q.v.b] || {a:0, c:0, d:null};
    e.a++; if(tout) e.c++; e.d = tout;
    stock.verbes[q.v.b] = e;

    if(etat.session.i === etat.session.questions.length - 1) terminer();
    sauver();
    verrou = Date.now() + 350;
    render(false);
  },
  suivante(){
    if(Date.now() < verrou) return;
    const S = etat.session;
    if(!courante().res) return;
    if(S.i < S.questions.length - 1){ S.i++; render(true); }
    else { etat.ecran = 'bilan'; render(true); }
  },
  abandon(){ etat.ecran = 'accueil'; etat.session = null; render(true); },
  accueil(){ etat.ecran = 'accueil'; etat.session = null; render(true); },
  rejouer(){ lancerSerie(etat.session.meta.niveau, etat.session.meta.mode); },
  erreurs(){
    const S = etat.session;
    const rates = S.questions.filter(q => !q.res.ok).map(q => q.v);
    if(!rates.length) return;
    lancer(melanger(rates), {niveau:S.meta.niveau, mode:S.meta.mode, revision:true});
  },
  effacer(){ etat.confirmer = true; render(false); },
  effacer_non(){ etat.confirmer = false; render(false); },
  effacer_oui(){ stock = vierge(); sauver(); etat.confirmer = false; render(true); }
};

function terminer(){
  const S = etat.session;
  const total = S.questions.length;
  const rev = !!S.meta.revision;
  const prec = stock.sessions.filter(x => !x.r);
  const ratio = S.score / total;
  S.record = !rev && total === NB && prec.length > 0 &&
             ratio > Math.max.apply(null, prec.map(x => x.s / x.t));
  stock.sessions.push({d:Date.now(), s:S.score, t:total, n:S.meta.niveau, m:S.meta.mode, r:rev ? 1 : 0});
  if(stock.sessions.length > 200) stock.sessions = stock.sessions.slice(-200);
}

/* ---------- Vues ---------- */
function vueAccueil(){
  const st = stats();
  const fb = faibles();
  let {niveau, mode} = stock.prefs;
  if(niveau === 'faibles' && !fb.length) niveau = '1';
  const nb = k => k === 'tous' ? VERBES.length : VERBES.filter(v => String(v.n) === k).length;

  const optsN = [['1','Indispensables',nb('1')],['2','Courants',nb('2')],['tous','Tous',nb('tous')],['faibles','Mes points faibles',fb.length]];
  const optsM = [['deux','Une forme donnée'],['trois','Français seulement']];

  const pastillesN = optsN.map(([val, nom, n]) =>
    `<label class="choix"><input type="radio" name="niveau" value="${val}" ${niveau === val ? 'checked' : ''} ${val === 'faibles' && !fb.length ? 'disabled' : ''}><span>${nom} <span class="nb">${n}</span></span></label>`
  ).join('');
  const pastillesM = optsM.map(([val, nom]) =>
    `<label class="choix"><input type="radio" name="mode" value="${val}" ${mode === val ? 'checked' : ''}><span>${nom}</span></label>`
  ).join('');

  let resultats;
  if(!stock.sessions.length){
    resultats = `<p class="vide">Tes résultats apparaîtront ici après ta première série.</p>`;
  }else{
    const hist = stock.sessions.slice(-8).reverse().map(x => {
      const d = new Date(x.d).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
      const lib = x.r ? 'Erreurs refaites'
        : (NOMS_NIVEAU[x.n] || '') + ', ' + (x.m === 'trois' ? '3 formes' : '2 formes');
      return `<li><span class="date">${esc(d)}</span><span class="detail">${esc(lib)}</span><span class="lead" aria-hidden="true"></span><strong>${x.s}/${x.t}</strong></li>`;
    }).join('');
    const revoir = fb.slice().sort((a, b) => {
      const ea = stock.verbes[a.b], eb = stock.verbes[b.b];
      return (ea.c / ea.a) - (eb.c / eb.a) || eb.a - ea.a;
    }).slice(0, 6).map(v => {
      const e = stock.verbes[v.b];
      return `<li><span class="gauche"><span class="formes">${aff(v.b)} – ${aff(v.p)} – ${aff(v.pp)}</span><small>${esc(v.fr)}</small></span><span class="lead" aria-hidden="true"></span><span>${e.c} sur ${e.a}</span></li>`;
    }).join('');
    resultats = `
      <ul class="points">
        <li><span>Séries jouées</span><span class="lead" aria-hidden="true"></span><strong>${st.jouees}</strong></li>
        <li><span>Meilleur score</span><span class="lead" aria-hidden="true"></span><strong>${st.meilleur ? st.meilleur.s + '/' + st.meilleur.t : '–'}</strong></li>
        <li><span>Moyenne des 5 dernières séries</span><span class="lead" aria-hidden="true"></span><strong>${st.moy !== null ? nombreFr(st.moy) + '/10' : '–'}</strong></li>
        <li><span>Verbes maîtrisés</span><span class="lead" aria-hidden="true"></span><strong>${st.maitrises} sur ${VERBES.length}</strong></li>
      </ul>
      <p class="discret">Un verbe est maîtrisé quand tu l'as réussi au moins 2 fois, dont la dernière.</p>
      <h2>Dernières séries</h2>
      <ul class="points">${hist}</ul>
      ${revoir ? `<h2>Verbes à revoir</h2><ul class="points">${revoir}</ul>` : ''}
      <div class="confirme">${etat.confirmer
        ? `<span>Effacer tous tes scores ?</span><button class="btn" data-action="effacer_oui">Oui, effacer</button><button class="lien" data-action="effacer_non">Annuler</button>`
        : `<button class="lien" data-action="effacer">Effacer mes scores</button>`}</div>`;
  }

  return `
    <h1>Verbes irréguliers</h1>
    <p class="discret" style="margin-top:.5rem">Anglais</p>
    <p class="intro">Chaque série compte ${NB} questions. Écris les formes manquantes : les verbes que tu rates reviennent plus souvent.</p>
    ${stockageOk ? '' : '<p class="alerte">Les scores ne peuvent pas être enregistrés ici (le navigateur bloque le stockage). Tu peux quand même t\'entraîner.</p>'}
    <h2>Ta série</h2>
    <fieldset><legend>Verbes</legend><div class="pastilles">${pastillesN}</div></fieldset>
    ${fb.length ? '' : '<p class="discret" style="margin-top:-.4rem">« Mes points faibles » se débloque dès que tu rates un verbe.</p>'}
    <fieldset><legend>Difficulté</legend><div class="pastilles">${pastillesM}</div></fieldset>
    <div class="actions"><button class="btn principal" data-action="commencer">Commencer une série de ${NB}</button></div>
    <h2>Tes résultats</h2>
    ${resultats}
    ${pied()}`;
}

function vueQuiz(){
  const S = etat.session;
  const q = courante();
  const n = S.questions.length;
  const dernier = S.i === n - 1;
  const trouver = aTrouver(q);

  const coches = S.questions.map((x, j) => {
    let cls = 'coche', sym = '', lab = 'Question ' + (j + 1);
    if(x.res){ cls += x.res.ok ? ' ok' : ' ko'; sym = x.res.ok ? '✓' : '✗'; lab += x.res.ok ? ', juste' : ', fausse'; }
    if(j === S.i) cls += ' courante';
    return `<li class="${cls}" aria-label="${lab}" ${j === S.i ? 'aria-current="step"' : ''}>${sym}</li>`;
  }).join('');

  const lignes = FORMES.map(f => {
    const k = f.k;
    if(q.donne === k){
      return `<div class="ligne"><span class="etiq">${f.nom}</span><span class="mot">${aff(q.v[k])}</span></div>`;
    }
    const r = q.res;
    const idx = trouver.indexOf(k);
    const hint = idx < trouver.length - 1 ? 'next' : 'done';
    const cls = r ? (r.champs[k] ? 'ok' : 'ko') : '';
    return `<div class="ligne ${cls}">
      <label class="etiq" for="champ-${k}">${f.nom}</label>
      <input id="champ-${k}" data-forme="${k}" type="text" value="${esc(q.saisies[k])}" ${r ? 'readonly aria-describedby="verdict-' + k + '"' : ''}
        autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="${hint}">
      ${r ? `<span class="verdict" id="verdict-${k}">${r.champs[k] ? '✓ Juste' : '✗ Réponse attendue : <b>' + aff(q.v[k]) + '</b>'}</span>` : ''}
    </div>`;
  }).join('');

  let retour = '';
  if(q.res){
    const ok = q.res.ok;
    retour = `<div class="retour ${ok ? 'ok' : 'ko'}" role="status">
      <p class="gras">${ok ? 'Juste.' : 'Pas tout à fait. Retiens :'}</p>
      <p class="triple">${aff(q.v.b)} – ${aff(q.v.p)} – ${aff(q.v.pp)}</p>
      ${q.v.note ? `<p class="discret">${esc(q.v.note)}</p>` : ''}
    </div>`;
  }

  const bouton = q.res
    ? `<button class="btn principal" id="btn-suivante" data-action="suivante">${dernier ? 'Voir mon bilan' : 'Question suivante'}</button>`
    : `<button class="btn principal" data-action="valider">Valider</button>`;

  return `
    <div class="tete">
      <p class="progres">Question ${S.i + 1} sur ${n}</p>
      <button class="lien" data-action="abandon">Abandonner</button>
    </div>
    <ol class="coches" aria-label="Progression">${coches}</ol>
    <h2 class="francais" style="margin:0">${esc(q.v.fr)}</h2>
    <p class="consigne">${q.donne ? 'Écris les deux formes manquantes.' : 'Écris les trois formes.'}</p>
    <div class="tableau">${lignes}</div>
    ${retour}
    <div class="actions">${bouton}</div>`;
}

function vueBilan(){
  const S = etat.session;
  const t = S.questions.length, s = S.score;
  const ratio = s / t;
  const mention = ratio === 1 ? 'Sans faute.'
    : ratio >= 0.8 ? 'Très bien.'
    : ratio >= 0.6 ? 'Bien.'
    : ratio >= 0.4 ? 'À consolider.'
    : 'Ça viendra avec la répétition.';
  const rates = S.questions.filter(q => !q.res.ok).length;

  const liste = S.questions.map(q => {
    const ok = q.res.ok;
    const fautes = aTrouver(q).filter(k => !q.res.champs[k]).map(k => {
      const f = FORMES.find(x => x.k === k);
      const ecrit = q.saisies[k].trim();
      return ecrit ? `Tu as écrit « ${esc(ecrit)} » pour ${f.court}.` : `${f.nom} laissé vide.`;
    }).join(' ');
    return `<li class="${ok ? 'ok' : 'ko'}">
      <span class="signe" aria-hidden="true">${ok ? '✓' : '✗'}</span>
      <div>
        <span class="sr-only" style="position:absolute;left:-9999px">${ok ? 'Juste' : 'Faux'} : </span>
        <span class="formes">${aff(q.v.b)} – ${aff(q.v.p)} – ${aff(q.v.pp)}</span>
        <span class="fr"> (${esc(q.v.fr)})</span>
        ${fautes ? `<p class="ecrit">${fautes}</p>` : ''}
      </div>
    </li>`;
  }).join('');

  return `
    <h1>Bilan</h1>
    <div><span class="note-rouge">${s}/${t}</span></div>
    <p class="mention">${mention}</p>
    ${S.record ? '<p><strong>Nouveau record.</strong> Meilleure série jusqu\'ici.</p>' : ''}
    <h2>Correction</h2>
    <ul class="corr">${liste}</ul>
    <div class="actions">
      <button class="btn principal" data-action="rejouer">Rejouer une série</button>
      ${rates ? `<button class="btn" data-action="erreurs">Refaire mes ${rates} erreur${rates > 1 ? 's' : ''}</button>` : ''}
      <button class="btn" data-action="accueil">Retour à l'accueil</button>
    </div>
    ${pied()}`;
}

function pied(){
  return `<footer><p>Fonctionne hors ligne. Les scores restent sur cet appareil.</p><p>Propulsé par Elie Biro</p></footer>`;
}

/* ---------- Affichage ---------- */
function render(nouvelEcran){
  app.innerHTML = etat.ecran === 'accueil' ? vueAccueil()
                : etat.ecran === 'quiz' ? vueQuiz() : vueBilan();
  if(nouvelEcran) window.scrollTo(0, 0);
  if(etat.ecran === 'quiz'){
    const q = courante();
    if(q.res){
      const b = document.getElementById('btn-suivante');
      if(b){
        b.focus();
        try{ b.scrollIntoView({block:'nearest'}); }catch(e){}
      }
    }else{
      const c = app.querySelector('input[data-forme]');
      if(c) c.focus({preventScroll:true});
    }
  }
}

/* ---------- Événements ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if(!b) return;
  const f = actions[b.dataset.action];
  if(f) f();
});
// iPhone : garder le clavier ouvert quand on touche « Valider », sinon le bouton
// peut bouger pendant la fermeture du clavier et le toucher est perdu.
app.addEventListener('mousedown', e => {
  if(e.target.closest && e.target.closest('[data-action="valider"]')) e.preventDefault();
});
app.addEventListener('change', e => {
  if(e.target.name === 'niveau' || e.target.name === 'mode'){
    stock.prefs[e.target.name] = e.target.value;
    sauver();
  }
});
app.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const t = e.target;
  if(!(t.matches && t.matches('input[data-forme]'))) return;
  e.preventDefault();
  if(t.readOnly){ actions.suivante(); return; }
  const champs = Array.prototype.slice.call(app.querySelectorAll('input[data-forme]'));
  const i = champs.indexOf(t);
  if(i < champs.length - 1){ champs[i + 1].focus(); return; }
  const vide = champs.find(c => !c.value.trim());
  if(vide){ vide.focus(); return; }
  actions.valider();
});

render(true);
})();
</script>
</body>
</html>
